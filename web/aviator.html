<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BETSPIN777 — Aviator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080a; --bg2:#0c0e11; --panel:#111417; --panel2:#171b1f; --panel3:#1d2226;
    --stroke:#262b30; --stroke2:#383f46;
    --text:#eef2f1; --muted:#9aa5a3; --dim:#5c6668;
    --lime:#c6ff3a; --lime-dk:#93cc12; --pink:#ff2f92;
    --red:#ff3b5c; --green:#2be08a;
    --display:"Space Grotesk",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    display:flex; align-items:flex-start; justify-content:center; min-height:100%; padding:18px 14px 30px;
  }
  a{color:inherit; text-decoration:none;}
  .hl{color:var(--lime);}
  .app{width:100%; max-width:860px;}

  /* ===== Topbar ===== */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--lime); border:2px solid #07080a; box-shadow:3px 3px 0 #000;}
  .brand .mark svg{width:20px;height:20px;fill:#07080a;stroke:none;}
  .brand .name{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.1px;line-height:1;}
  .brand .name .sub{display:block;font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--dim);font-weight:500;margin-top:4px;text-transform:uppercase;}
  .top-right{display:flex; gap:10px; align-items:center;}
  .back{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;font-family:var(--mono);color:var(--muted);border:2px solid var(--stroke2);
    border-radius:6px;padding:9px 13px;transition:.15s;}
  .back:hover{border-color:var(--lime);color:var(--lime);}
  .balance{display:flex; align-items:center; gap:9px; background:var(--panel);
    border:2px solid var(--stroke2); border-radius:8px; padding:9px 14px; font-weight:800; font-size:17px; font-family:var(--mono);}
  .balance .coin{width:22px;height:22px;border-radius:5px;background:var(--lime);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#07080a;font-weight:900;}
  .room{font-size:10px;color:var(--dim);line-height:1.3;text-align:right;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
  .room b{color:var(--lime);font-size:14px;letter-spacing:1.5px;font-family:var(--mono);}
  .auto-badge{position:absolute;top:12px;left:14px;font-size:11px;font-weight:800;color:var(--muted);font-family:var(--mono);
    background:var(--panel);padding:5px 11px;border-radius:100px;border:2px solid var(--stroke2);text-transform:uppercase;letter-spacing:.5px;}
  .auto-badge.on{color:#07080a;background:var(--green);border-color:#07080a;}

  /* ===== Stage ===== */
  .stage{position:relative; border:2px solid var(--stroke2); border-radius:10px; overflow:hidden;
    background:var(--panel); box-shadow:5px 5px 0 #000;}
  canvas{display:block; width:100%; height:auto;}
  .live-badge{position:absolute; top:12px; right:14px; display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800;
    font-family:var(--mono); letter-spacing:1px; color:#fff; background:var(--red); padding:5px 11px; border-radius:100px;}
  .live-badge .d{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s infinite;}
  @keyframes blink{50%{opacity:.25;}}

  /* ===== History ===== */
  .history{display:flex; gap:7px; flex-wrap:wrap; margin:12px 2px 14px;}
  .pill{font-size:12.5px; font-weight:800; font-family:var(--mono); padding:5px 11px; border-radius:6px; background:var(--panel2); color:var(--muted); border:2px solid var(--stroke);}
  .pill.hi{background:var(--panel2); color:var(--green); border-color:var(--green);}
  .pill.lo{background:var(--panel2); color:var(--red); border-color:var(--red);}
  .pill.mid{background:var(--panel2); color:var(--lime); border-color:var(--lime);}

  /* ===== Controls ===== */
  .controls{display:flex; gap:12px; align-items:stretch;}
  .betbox{display:flex; align-items:center; gap:10px; background:var(--panel);
    border:2px solid var(--stroke2); border-radius:8px; padding:8px 12px;}
  .betbox .val{min-width:70px; text-align:center; font-weight:800; font-size:18px; font-family:var(--mono); color:var(--lime);}
  button{font-family:var(--sans); cursor:pointer; border:2px solid #07080a; border-radius:8px; font-weight:800; font-size:16px; transition:filter .12s, transform .1s, box-shadow .1s;}
  button:active{transform:translate(1px,1px);}
  button:disabled{filter:grayscale(.5) brightness(.7); cursor:default;}
  .sq{width:46px; height:46px; font-size:22px; background:var(--panel3); color:var(--lime); border:2px solid var(--stroke2);}
  .sq:hover:not(:disabled){border-color:var(--lime);}
  .main{flex:1; font-size:18px; letter-spacing:.2px; color:#07080a;
    background:var(--lime); box-shadow:5px 5px 0 #000;}
  .main:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000;}
  .main.cash{background:var(--green);}
  .quick{display:flex; gap:8px; margin-top:12px;}
  .quick button{flex:1; padding:11px; font-size:13px; font-family:var(--mono); background:var(--panel2); color:var(--muted); border:2px solid var(--stroke2); font-weight:700;}
  .quick button:hover{border-color:var(--lime); color:var(--lime);}
  .hint{color:var(--dim); font-size:12px; font-family:var(--mono); text-align:center; margin-top:14px;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 10-13h-7z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
</svg>

<div class="app">
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24"><use href="#i-mark"/></svg></span>
      <span class="name">BETSPIN<span class="hl">777</span><span class="sub">Aviator</span></span>
    </a>
    <div class="top-right">
      <a class="back" href="index.html"><svg class="ic" width="16" height="16"><use href="#i-back"/></svg> Ana Sayfa</a>
      <div class="room">Oturum<br><b id="roomCode">MAIN</b></div>
      <div class="balance"><span class="coin">₺</span><span id="balance">0.00</span></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv" width="860" height="470"></canvas>
    <div class="live-badge"><span class="d"></span>LIVE</div>
    <div class="auto-badge" id="autoBadge">Oto: kapalı</div>
  </div>

  <div class="history" id="history"></div>

  <div class="controls">
    <div class="betbox">
      <button class="sq" id="minus">−</button>
      <div class="val" id="betVal">10</div>
      <button class="sq" id="plus">+</button>
    </div>
    <button class="main" id="mainBtn">Bahis Koy</button>
  </div>
  <div class="quick">
    <button data-q="10">₺10</button>
    <button data-q="25">₺25</button>
    <button data-q="50">₺50</button>
    <button data-q="100">₺100</button>
    <button id="qMax">MAX</button>
  </div>
  <div class="hint">BOŞLUK: Bahis Koy / Çek &nbsp;·&nbsp; Sorumlu oyna · 18+</div>
</div>

<script>
// ===== Guthaben: gemeinsam mit der Website (localStorage 'gk_balance') =====
let balance = parseFloat(localStorage.getItem('gk_balance'));
if(isNaN(balance)){ balance = 0; }
let bet = 10;
function saveBal(){ try{ localStorage.setItem('gk_balance', String(balance)); }catch(e){} }

let phase = 'idle', phaseT = 0, countdown = 0;
let multiplier = 1, crashAt = genCrash();
let roundId = Date.now(); // changes once per round, so a tracker can tell rounds apart
let inBet = false, cashed = false, cashoutMult = 0;
let history = [];
let t = 0;
let autoDecided = false, lastCmd = null;

// ===== Sitzung / Kanal (Tracker liest crash_at über den Server) =====
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || 'MAIN').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,24) || 'MAIN';
document.getElementById('roomCode').textContent = ROOM;
async function postState(){
  try{
    await fetch('/api/state?room='+ROOM, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        game:'aviator', round_id:roundId, crash_at:crashAt, phase,
        multiplier: Math.round(multiplier*100)/100,
        balance: Math.round(balance*100)/100,
        in_bet: inBet, cashed, ts: Date.now()/1000
      })
    });
  }catch(e){}
}
async function pollCommand(){ try{ const r=await fetch('/api/command?room='+ROOM); lastCmd=await r.json(); }catch(e){} }
setInterval(postState, 120);   // ~8/s in die Cloud schreiben
setInterval(pollCommand, 150); // ~7/s Kommando lesen

function genCrash(){
  if (Math.random() < 0.03) return 1.00;
  const r = Math.random();
  const c = 0.99 / (1 - r);
  return Math.min(Math.round(Math.max(1.01, c) * 100) / 100, 100.00);
}

// ===== Rundenlogik =====
function placeBet(){
  if (phase !== 'idle' || inBet) return;
  if (bet > balance) bet = balance;
  if (bet <= 0) return;
  balance -= bet; inBet = true; cashed = false; saveBal();
}
function startFlight(){ phase='flying'; phaseT=0; multiplier=1; }
function cashOut(){
  if (phase!=='flying' || !inBet || cashed) return;
  cashed = true; cashoutMult = multiplier; balance += bet * multiplier; saveBal();
}
function newRound(){
  history.unshift(crashAt); history = history.slice(0,16);
  phase='idle'; phaseT=0; multiplier=1; inBet=false; cashed=false;
  autoDecided=false; crashAt=genCrash(); roundId=Date.now();
  renderHistory();
}

function update(dt){
  t += dt; phaseT += dt;
  // Tracker-Kommando (auto): nur wenn frisch (< 1.5s)
  const fresh = lastCmd && (Date.now()/1000 - (lastCmd.ts||0) < 1.5);
  const cmd = fresh ? lastCmd : null;
  const auto = !!(cmd && cmd.auto);
  const ab = document.getElementById('autoBadge');
  ab.textContent = 'Oto: ' + (auto?'açık':'kapalı');
  ab.classList.toggle('on', auto);

  if (phase === 'idle'){
    if (auto && !autoDecided){
      const target = cmd.target || 0;
      if (target > 1 && balance > 0){ bet = Math.min(bet, balance); placeBet(); }
      autoDecided = true;
    }
    const win = auto ? 1.0 : 4.0;
    countdown = Math.max(0, win - phaseT);
    if (phaseT >= win) startFlight();
  } else if (phase === 'flying'){
    multiplier = Math.round(Math.exp(0.23 * phaseT) * 100) / 100;
    if (auto && inBet && !cashed){
      const target = cmd.target || 0;
      if (target && multiplier >= target){ multiplier = Math.min(multiplier, target); cashOut(); }
    }
    if (multiplier >= crashAt){ multiplier = crashAt; phase='crashed'; phaseT=0; }
  } else if (phase === 'crashed'){
    if (phaseT >= (auto ? 0.8 : 1.6)) newRound();
  }
  updateHUD();
}

// ===== Flugzeug-Position (unabhängig vom Crash) =====
function prog(){ if (phase==='idle') return 0; return 1 - 1/Math.max(1,multiplier); }

// ===== Zeichnen =====
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = H - 70;
const stars = Array.from({length:80}, () => ({x:Math.random()*W, y:Math.random()*GROUND, r:Math.random()*1.6+0.4, p:Math.random()*6.28}));

function curvePoint(p){
  const x = 70 + p*(W-160);
  const y = GROUND - Math.sin(p*Math.PI/2)*(GROUND-120);
  return [x,y];
}
function draw(){
  // Himmel
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0f1310'); g.addColorStop(1,'#07080a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // pembe yıldızlar
  for (const s of stars){ const a=0.25+0.5*(0.5+0.5*Math.sin(t*2+s.p));
    ctx.fillStyle=`rgba(255,47,146,${a})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }
  // Boden
  ctx.fillStyle='#0c0f0d'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='#262b30'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();

  const crashed = phase==='crashed';
  const p = prog();
  if (p > 0){
    const pts=[]; for(let i=0;i<=40;i++) pts.push(curvePoint(p*i/40));
    // Füllung
    ctx.beginPath(); ctx.moveTo(pts[0][0],GROUND);
    for(const q of pts) ctx.lineTo(q[0],q[1]);
    ctx.lineTo(pts[pts.length-1][0],GROUND); ctx.closePath();
    ctx.fillStyle = crashed ? 'rgba(255,59,92,.14)' : 'rgba(198,255,58,.14)';
    ctx.fill();
    // Glow-Linie
    ctx.lineJoin='round'; ctx.lineWidth=11; ctx.strokeStyle = crashed?'rgba(255,59,92,.22)':'rgba(198,255,58,.22)';
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(const q of pts) ctx.lineTo(q[0],q[1]); ctx.stroke();
    // Ana çizgi
    ctx.lineWidth=4;
    if(crashed){ ctx.strokeStyle='#ff8a9e'; }
    else { const lg=ctx.createLinearGradient(pts[0][0],0,pts[pts.length-1][0],0); lg.addColorStop(0,'#93cc12'); lg.addColorStop(1,'#c6ff3a'); ctx.strokeStyle=lg; }
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(const q of pts) ctx.lineTo(q[0],q[1]); ctx.stroke();
    // Uçak
    const [px,py]=curvePoint(p);
    if (!crashed) drawPlane(px,py);
    else { ctx.fillStyle='#ff3b5c'; ctx.font='bold 26px '+cssSerif(); ctx.textAlign='center'; ctx.fillText('Uçtu Gitti!', px, py-24); }
  }
  // Multiplikator
  ctx.textAlign='center';
  ctx.fillStyle = crashed?'#ff3b5c':(cashed?'#2be08a':'#c6ff3a');
  ctx.font='bold 80px '+cssSerif();
  ctx.shadowColor = crashed?'rgba(255,59,92,.5)':'rgba(198,255,58,.4)'; ctx.shadowBlur=32;
  ctx.fillText(multiplier.toFixed(2)+'×', W/2, 175);
  ctx.shadowBlur=0;
  if (phase==='idle'){ ctx.fillStyle='#9aa5a3'; ctx.font='22px '+cssSans();
    ctx.fillText('Sonraki uçuş '+countdown.toFixed(1)+' sn sonra', W/2, 220); }
  if (cashed && phase!=='idle'){ ctx.fillStyle='#2be08a'; ctx.font='bold 22px '+cssSans();
    ctx.fillText('Çekildi +₺'+(bet*cashoutMult).toFixed(2), W/2, 220); }
}
function cssSerif(){ return 'Space Grotesk, system-ui, sans-serif'; }
function cssSans(){ return 'JetBrains Mono, Consolas, monospace'; }

function drawPlane(x,y){
  const [x1,y1]=curvePoint(Math.max(0,prog()-0.02)), [x2,y2]=curvePoint(Math.min(1,prog()+0.001));
  const ang = Math.atan2((y2-y1),(x2-x1));
  ctx.save(); ctx.translate(x + Math.sin(t*3)*3, y + Math.sin(t*5)*4); ctx.rotate(ang);
  // Gövde
  ctx.fillStyle='#c6ff3a'; ctx.beginPath(); ctx.ellipse(0,0,26,10,0,0,6.28); ctx.fill();
  // Burun
  ctx.fillStyle='#93cc12'; ctx.beginPath(); ctx.moveTo(24,0); ctx.lineTo(34,7); ctx.lineTo(24,10); ctx.fill();
  // Kanat
  ctx.fillStyle='#ff2f92'; ctx.beginPath(); ctx.moveTo(-4,4); ctx.lineTo(10,4); ctx.lineTo(4,18); ctx.lineTo(-12,18); ctx.fill();
  // Pencere
  ctx.fillStyle='#07080a'; ctx.beginPath(); ctx.arc(8,-2,3.5,0,6.28); ctx.fill();
  ctx.restore();
}

// ===== HUD =====
function updateHUD(){
  document.getElementById('balance').textContent = balance.toFixed(2);
  document.getElementById('betVal').textContent = Math.round(bet);
  const b = document.getElementById('mainBtn');
  if (phase==='flying' && inBet && !cashed){ b.textContent='Çek  ₺'+(bet*multiplier).toFixed(2); b.classList.add('cash'); b.disabled=false; }
  else if (phase==='idle'){
    if(!inBet && balance<=0){ b.textContent='Bakiye Yükle →'; b.classList.remove('cash'); b.disabled=false; }
    else { b.textContent = inBet ? 'Başlangıç bekleniyor…' : 'Bahis Koy'; b.classList.remove('cash'); b.disabled=inBet; }
  }
  else { b.classList.remove('cash'); b.disabled=true; b.textContent = inBet&&cashed?'Çekildi ✓':(phase==='flying'?'Uçuyor…':'…'); }
}
function renderHistory(){
  const h=document.getElementById('history'); h.innerHTML='';
  for(const v of history){ const s=document.createElement('span');
    s.className='pill '+(v>=2?'hi':(v<1.3?'lo':'mid')); s.textContent=v.toFixed(2)+'×'; h.appendChild(s); }
}
function mainAction(){
  if (phase==='flying' && inBet && !cashed) cashOut();
  else if (phase==='idle' && !inBet){
    if(balance<=0){ location.href='index.html'; return; }
    placeBet();
  }
}
document.getElementById('mainBtn').onclick=mainAction;
document.getElementById('minus').onclick=()=>{ if(phase==='idle'&&!inBet) bet=Math.max(1,Math.min(balance,bet-5)); updateHUD(); };
document.getElementById('plus').onclick =()=>{ if(phase==='idle'&&!inBet) bet=Math.max(1,Math.min(balance,bet+5)); updateHUD(); };
document.querySelectorAll('.quick button[data-q]').forEach(function(btn){
  btn.onclick=function(){ if(phase==='idle'&&!inBet){ bet=Math.max(1,Math.min(balance,parseInt(btn.dataset.q,10))); updateHUD(); } };
});
document.getElementById('qMax').onclick=function(){ if(phase==='idle'&&!inBet){ bet=Math.max(1,Math.floor(balance)); updateHUD(); } };
window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); mainAction(); } });

// ===== Schleife =====
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
renderHistory(); updateHUD(); requestAnimationFrame(loop);

// Guthaben mit der Website synchronisieren (anderer Tab)
window.addEventListener('storage', function(e){
  if(e.key==='gk_balance'){ balance=parseFloat(e.newValue||'0')||0; updateHUD(); }
});
</script>
</body>
</html>
