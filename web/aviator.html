<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GOLDKAISER — Aviator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070604; --bg2:#0c0a06; --panel:#12100a; --panel2:#181510; --panel3:#221d13;
    --stroke:#2a2416; --stroke2:#3b3220;
    --text:#f6f1e6; --muted:#b7ad97; --dim:#7d745f;
    --gold:#d4af37; --gold-lt:#f5d982; --gold-dk:#a5842a;
    --goldGlow:rgba(212,175,55,.35);
    --red:#e05a4a; --red-dk:#c0392b; --green:#3fae74; --green-lt:#6fe0a6;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1000px 600px at 50% 12%, rgba(212,175,55,.10), transparent 60%),
      linear-gradient(180deg,#090705,var(--bg));
    color:var(--text); font-family:var(--sans);
    display:flex; align-items:flex-start; justify-content:center; min-height:100%; padding:18px 14px 30px;
  }
  a{color:inherit; text-decoration:none;}
  .gold{background:linear-gradient(92deg,var(--gold-lt),var(--gold) 45%,#ffe9a8 60%,var(--gold-dk));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .app{width:100%; max-width:860px;}

  /* ===== Topbar ===== */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;}
  .logo{display:flex; align-items:center; gap:11px;}
  .logo .crown{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1b160c,#0d0b06); border:1px solid var(--gold-dk);
    box-shadow:0 6px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(245,217,130,.25);}
  .logo .crown svg{width:24px;height:24px;fill:url(#gg);}
  .logo .name{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:1.2px;line-height:1;}
  .logo .name .sub{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:3px;color:var(--dim);font-weight:600;margin-top:3px;text-transform:uppercase;}
  .top-right{display:flex; gap:10px; align-items:center;}
  .back{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--stroke2);
    border-radius:11px;padding:9px 14px;transition:.15s;}
  .back:hover{border-color:var(--gold);color:var(--gold-lt);}
  .balance{display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--stroke2); border-radius:12px; padding:9px 15px; font-weight:800; font-size:18px;}
  .balance .coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe8a3,var(--gold));
    border:2px solid #b5872b; display:flex;align-items:center;justify-content:center;font-size:12px;color:#5a4108;font-weight:900;}
  .room{font-size:11px;color:var(--dim);line-height:1.3;text-align:right;}
  .room b{color:var(--gold-lt);font-size:15px;letter-spacing:2px;font-family:var(--serif);}
  .auto-badge{position:absolute;top:12px;left:14px;font-size:12px;font-weight:800;color:var(--muted);
    background:rgba(10,8,4,.7);padding:5px 11px;border-radius:999px;border:1px solid var(--stroke2);}
  .auto-badge.on{color:#062015;background:var(--green-lt);border-color:transparent;}

  /* ===== Stage ===== */
  .stage{position:relative; border:1px solid var(--stroke2); border-radius:20px; overflow:hidden;
    background:linear-gradient(180deg,#100d08,#070503); box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(245,217,130,.08);}
  .stage::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;box-shadow:inset 0 0 60px rgba(0,0,0,.5);}
  canvas{display:block; width:100%; height:auto;}
  .live-badge{position:absolute; top:12px; right:14px; display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800;
    letter-spacing:1px; color:#fff; background:var(--red-dk); padding:5px 11px; border-radius:999px;}
  .live-badge .d{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s infinite;}
  @keyframes blink{50%{opacity:.25;}}

  /* ===== History ===== */
  .history{display:flex; gap:7px; flex-wrap:wrap; margin:12px 2px 14px;}
  .pill{font-size:13px; font-weight:800; padding:5px 11px; border-radius:999px; background:var(--panel2); color:var(--muted); border:1px solid var(--stroke);}
  .pill.hi{background:linear-gradient(180deg,rgba(63,174,116,.25),rgba(63,174,116,.12)); color:var(--green-lt); border-color:rgba(63,174,116,.4);}
  .pill.lo{background:linear-gradient(180deg,rgba(224,90,74,.22),rgba(224,90,74,.10)); color:#f0a99f; border-color:rgba(224,90,74,.4);}
  .pill.mid{background:linear-gradient(180deg,rgba(212,175,55,.20),rgba(212,175,55,.08)); color:var(--gold-lt); border-color:rgba(212,175,55,.4);}

  /* ===== Controls ===== */
  .controls{display:flex; gap:12px; align-items:stretch;}
  .betbox{display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--stroke2); border-radius:14px; padding:8px 12px;}
  .betbox .val{min-width:70px; text-align:center; font-weight:800; font-size:19px; font-family:var(--serif); color:var(--gold-lt);}
  button{font-family:var(--sans); cursor:pointer; border:none; border-radius:13px; font-weight:800; font-size:16px; transition:filter .12s, transform .02s;}
  button:active{transform:translateY(1px);}
  button:disabled{filter:grayscale(.5) brightness(.7); cursor:default;}
  .sq{width:46px; height:46px; font-size:24px; background:var(--panel3); color:var(--gold-lt); border:1px solid var(--stroke2);}
  .sq:hover:not(:disabled){border-color:var(--gold);}
  .main{flex:1; font-size:19px; letter-spacing:.4px; color:#2a2005;
    background:linear-gradient(180deg,var(--gold-lt),var(--gold-dk)); box-shadow:0 8px 22px var(--goldGlow); border:1px solid var(--gold-lt);}
  .main:hover:not(:disabled){filter:brightness(1.06);}
  .main.cash{background:linear-gradient(180deg,var(--green-lt),#2e8b57); color:#062015; box-shadow:0 8px 22px rgba(63,174,116,.35); border-color:var(--green-lt);}
  .quick{display:flex; gap:8px; margin-top:12px;}
  .quick button{flex:1; padding:11px; font-size:13.5px; background:var(--panel2); color:var(--muted); border:1px solid var(--stroke2); font-weight:700;}
  .quick button:hover{border-color:var(--gold); color:var(--gold-lt);}
  .hint{color:var(--dim); font-size:12.5px; text-align:center; margin-top:14px;}
  .demo-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold-lt);
    border:1px solid var(--stroke2);border-radius:100px;padding:3px 10px;background:rgba(212,175,55,.06);}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d982"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#a5842a"/>
    </linearGradient>
  </defs>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5L3 8z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
</svg>

<div class="app">
  <div class="topbar">
    <a class="logo" href="index.html">
      <span class="crown"><svg viewBox="0 0 24 24"><use href="#i-crown"/></svg></span>
      <span class="name"><span class="gold">GOLD</span>KAISER<span class="sub">Aviator</span></span>
    </a>
    <div class="top-right">
      <a class="back" href="index.html"><svg class="ic" width="16" height="16"><use href="#i-back"/></svg> Startseite</a>
      <div class="room">Sitzung<br><b id="roomCode">MAIN</b></div>
      <div class="balance"><span class="coin">€</span><span id="balance">0.00</span></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv" width="860" height="470"></canvas>
    <div class="live-badge"><span class="d"></span>LIVE</div>
    <div class="auto-badge" id="autoBadge">Auto: aus</div>
  </div>

  <div class="history" id="history"></div>

  <div class="controls">
    <div class="betbox">
      <button class="sq" id="minus">−</button>
      <div class="val" id="betVal">10</div>
      <button class="sq" id="plus">+</button>
    </div>
    <button class="main" id="mainBtn">Einsatz setzen</button>
  </div>
  <div class="quick">
    <button data-q="10">€10</button>
    <button data-q="25">€25</button>
    <button data-q="50">€50</button>
    <button data-q="100">€100</button>
    <button id="qMax">MAX</button>
  </div>
  <div class="hint"><span class="demo-badge">Demo</span> &nbsp; LEERTASTE: Einsatz / Auszahlen &nbsp;·&nbsp; Spiele verantwortungsbewusst · 18+</div>
</div>

<script>
// ===== Guthaben: gemeinsam mit der Website (localStorage 'gk_balance') =====
let balance = parseFloat(localStorage.getItem('gk_balance'));
if(isNaN(balance)){ balance = 0; }
let bet = 10;
function saveBal(){ try{ localStorage.setItem('gk_balance', String(balance)); }catch(e){} }

let phase = 'idle', phaseT = 0, countdown = 0;
let multiplier = 1, crashAt = genCrash();
let inBet = false, cashed = false, cashoutMult = 0;
let history = [];
let t = 0;
let autoDecided = false, lastCmd = null;

// ===== Sitzung / Kanal (Tracker liest crash_at über den Server) =====
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || 'MAIN').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,24) || 'MAIN';
document.getElementById('roomCode').textContent = ROOM;
async function postState(){
  try{
    await fetch('/api/state?room='+ROOM, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        game:'aviator', crash_at:crashAt, phase,
        multiplier: Math.round(multiplier*100)/100,
        balance: Math.round(balance*100)/100,
        in_bet: inBet, cashed, ts: Date.now()/1000
      })
    });
  }catch(e){}
}
async function pollCommand(){ try{ const r=await fetch('/api/command?room='+ROOM); lastCmd=await r.json(); }catch(e){} }
setInterval(postState, 120);   // ~8/s in die Cloud schreiben
setInterval(pollCommand, 150); // ~7/s Kommando lesen

function genCrash(){
  if (Math.random() < 0.03) return 1.00;
  const r = Math.random();
  const c = 0.99 / (1 - r);
  return Math.min(Math.round(Math.max(1.01, c) * 100) / 100, 100.00);
}

// ===== Rundenlogik =====
function placeBet(){
  if (phase !== 'idle' || inBet) return;
  if (bet > balance) bet = balance;
  if (bet <= 0) return;
  balance -= bet; inBet = true; cashed = false; saveBal();
}
function startFlight(){ phase='flying'; phaseT=0; multiplier=1; }
function cashOut(){
  if (phase!=='flying' || !inBet || cashed) return;
  cashed = true; cashoutMult = multiplier; balance += bet * multiplier; saveBal();
}
function newRound(){
  history.unshift(crashAt); history = history.slice(0,16);
  phase='idle'; phaseT=0; multiplier=1; inBet=false; cashed=false;
  autoDecided=false; crashAt=genCrash();
  renderHistory();
}

function update(dt){
  t += dt; phaseT += dt;
  // Tracker-Kommando (auto): nur wenn frisch (< 1.5s)
  const fresh = lastCmd && (Date.now()/1000 - (lastCmd.ts||0) < 1.5);
  const cmd = fresh ? lastCmd : null;
  const auto = !!(cmd && cmd.auto);
  const ab = document.getElementById('autoBadge');
  ab.textContent = 'Auto: ' + (auto?'an':'aus');
  ab.classList.toggle('on', auto);

  if (phase === 'idle'){
    if (auto && !autoDecided){
      const target = cmd.target || 0;
      if (target > 1 && balance > 0){ bet = Math.min(bet, balance); placeBet(); }
      autoDecided = true;
    }
    const win = auto ? 1.0 : 4.0;
    countdown = Math.max(0, win - phaseT);
    if (phaseT >= win) startFlight();
  } else if (phase === 'flying'){
    multiplier = Math.round(Math.exp(0.23 * phaseT) * 100) / 100;
    if (auto && inBet && !cashed){
      const target = cmd.target || 0;
      if (target && multiplier >= target){ multiplier = Math.min(multiplier, target); cashOut(); }
    }
    if (multiplier >= crashAt){ multiplier = crashAt; phase='crashed'; phaseT=0; }
  } else if (phase === 'crashed'){
    if (phaseT >= (auto ? 0.8 : 1.6)) newRound();
  }
  updateHUD();
}

// ===== Flugzeug-Position (unabhängig vom Crash) =====
function prog(){ if (phase==='idle') return 0; return 1 - 1/Math.max(1,multiplier); }

// ===== Zeichnen =====
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = H - 70;
const stars = Array.from({length:80}, () => ({x:Math.random()*W, y:Math.random()*GROUND, r:Math.random()*1.6+0.4, p:Math.random()*6.28}));

function curvePoint(p){
  const x = 70 + p*(W-160);
  const y = GROUND - Math.sin(p*Math.PI/2)*(GROUND-120);
  return [x,y];
}
function draw(){
  // Himmel (schwarz-gold)
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141009'); g.addColorStop(1,'#080603');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // goldene Sterne
  for (const s of stars){ const a=0.25+0.5*(0.5+0.5*Math.sin(t*2+s.p));
    ctx.fillStyle=`rgba(245,217,130,${a})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }
  // Boden
  ctx.fillStyle='#100c07'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='#3b3220'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();

  const crashed = phase==='crashed';
  const p = prog();
  if (p > 0){
    const pts=[]; for(let i=0;i<=40;i++) pts.push(curvePoint(p*i/40));
    // Füllung
    ctx.beginPath(); ctx.moveTo(pts[0][0],GROUND);
    for(const q of pts) ctx.lineTo(q[0],q[1]);
    ctx.lineTo(pts[pts.length-1][0],GROUND); ctx.closePath();
    ctx.fillStyle = crashed ? 'rgba(224,90,74,.14)' : 'rgba(212,175,55,.14)';
    ctx.fill();
    // Glow-Linie
    ctx.lineJoin='round'; ctx.lineWidth=11; ctx.strokeStyle = crashed?'rgba(224,90,74,.22)':'rgba(212,175,55,.22)';
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(const q of pts) ctx.lineTo(q[0],q[1]); ctx.stroke();
    // goldene Linie
    ctx.lineWidth=4;
    if(crashed){ ctx.strokeStyle='#f0a99f'; }
    else { const lg=ctx.createLinearGradient(pts[0][0],0,pts[pts.length-1][0],0); lg.addColorStop(0,'#a5842a'); lg.addColorStop(1,'#f5d982'); ctx.strokeStyle=lg; }
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(const q of pts) ctx.lineTo(q[0],q[1]); ctx.stroke();
    // Flugzeug
    const [px,py]=curvePoint(p);
    if (!crashed) drawPlane(px,py);
    else { ctx.fillStyle='#e05a4a'; ctx.font='bold 26px '+cssSerif(); ctx.textAlign='center'; ctx.fillText('Davongeflogen!', px, py-24); }
  }
  // Multiplikator
  ctx.textAlign='center';
  ctx.fillStyle = crashed?'#e05a4a':(cashed?'#6fe0a6':'#f5d982');
  ctx.font='bold 80px '+cssSerif();
  ctx.shadowColor = crashed?'rgba(224,90,74,.55)':'rgba(212,175,55,.55)'; ctx.shadowBlur=32;
  ctx.fillText(multiplier.toFixed(2)+'×', W/2, 175);
  ctx.shadowBlur=0;
  if (phase==='idle'){ ctx.fillStyle='#b7ad97'; ctx.font='22px '+cssSans();
    ctx.fillText('Nächster Flug in '+countdown.toFixed(1)+' s', W/2, 220); }
  if (cashed && phase!=='idle'){ ctx.fillStyle='#6fe0a6'; ctx.font='bold 22px '+cssSans();
    ctx.fillText('Ausgezahlt +€'+(bet*cashoutMult).toFixed(2), W/2, 220); }
}
function cssSerif(){ return 'Cormorant Garamond, Georgia, serif'; }
function cssSans(){ return 'Manrope, Segoe UI, Arial, sans-serif'; }

function drawPlane(x,y){
  const [x1,y1]=curvePoint(Math.max(0,prog()-0.02)), [x2,y2]=curvePoint(Math.min(1,prog()+0.001));
  const ang = Math.atan2((y2-y1),(x2-x1));
  ctx.save(); ctx.translate(x + Math.sin(t*3)*3, y + Math.sin(t*5)*4); ctx.rotate(ang);
  // Rumpf gold
  ctx.fillStyle='#f5d982'; ctx.beginPath(); ctx.ellipse(0,0,26,10,0,0,6.28); ctx.fill();
  // Nase dunkelgold
  ctx.fillStyle='#a5842a'; ctx.beginPath(); ctx.moveTo(24,0); ctx.lineTo(34,7); ctx.lineTo(24,10); ctx.fill();
  // Flügel
  ctx.fillStyle='#d4af37'; ctx.beginPath(); ctx.moveTo(-4,4); ctx.lineTo(10,4); ctx.lineTo(4,18); ctx.lineTo(-12,18); ctx.fill();
  // Fenster
  ctx.fillStyle='#2a2005'; ctx.beginPath(); ctx.arc(8,-2,3.5,0,6.28); ctx.fill();
  ctx.restore();
}

// ===== HUD =====
function updateHUD(){
  document.getElementById('balance').textContent = balance.toFixed(2);
  document.getElementById('betVal').textContent = Math.round(bet);
  const b = document.getElementById('mainBtn');
  if (phase==='flying' && inBet && !cashed){ b.textContent='Auszahlen  €'+(bet*multiplier).toFixed(2); b.classList.add('cash'); b.disabled=false; }
  else if (phase==='idle'){
    if(!inBet && balance<=0){ b.textContent='Guthaben aufladen →'; b.classList.remove('cash'); b.disabled=false; }
    else { b.textContent = inBet ? 'Warte auf Start…' : 'Einsatz setzen'; b.classList.remove('cash'); b.disabled=inBet; }
  }
  else { b.classList.remove('cash'); b.disabled=true; b.textContent = inBet&&cashed?'Ausgezahlt ✓':(phase==='flying'?'Fliegt…':'…'); }
}
function renderHistory(){
  const h=document.getElementById('history'); h.innerHTML='';
  for(const v of history){ const s=document.createElement('span');
    s.className='pill '+(v>=2?'hi':(v<1.3?'lo':'mid')); s.textContent=v.toFixed(2)+'×'; h.appendChild(s); }
}
function mainAction(){
  if (phase==='flying' && inBet && !cashed) cashOut();
  else if (phase==='idle' && !inBet){
    if(balance<=0){ location.href='index.html'; return; }
    placeBet();
  }
}
document.getElementById('mainBtn').onclick=mainAction;
document.getElementById('minus').onclick=()=>{ if(phase==='idle'&&!inBet) bet=Math.max(1,Math.min(balance,bet-5)); updateHUD(); };
document.getElementById('plus').onclick =()=>{ if(phase==='idle'&&!inBet) bet=Math.max(1,Math.min(balance,bet+5)); updateHUD(); };
document.querySelectorAll('.quick button[data-q]').forEach(function(btn){
  btn.onclick=function(){ if(phase==='idle'&&!inBet){ bet=Math.max(1,Math.min(balance,parseInt(btn.dataset.q,10))); updateHUD(); } };
});
document.getElementById('qMax').onclick=function(){ if(phase==='idle'&&!inBet){ bet=Math.max(1,Math.floor(balance)); updateHUD(); } };
window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); mainAction(); } });

// ===== Schleife =====
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
renderHistory(); updateHUD(); requestAnimationFrame(loop);

// Guthaben mit der Website synchronisieren (anderer Tab)
window.addEventListener('storage', function(e){
  if(e.key==='gk_balance'){ balance=parseFloat(e.newValue||'0')||0; updateHUD(); }
});
</script>
</body>
</html>
