<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>44 Milyon Euro</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .marquee-wrap {
    position: fixed;
    top: 50%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    white-space: nowrap;
    overflow: hidden;
  }
  .marquee-text {
    display: inline-block;
    padding-left: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
    font-weight: 700;
    font-size: 8vw;
    color: #ffd700;
    animation: scroll 14s linear infinite;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }
</style>
</head>
<body>
  <div class="marquee-wrap">
    <span class="marquee-text">44 MİLYON EURO NEREDE?</span>
  </div>
</body>
</html>
